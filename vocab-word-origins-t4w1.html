<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Country Word Explorer</title>
<style>
:root{
  --dark:#1f3864; --blue:#2e75b6; --green:#2e7d32; --gold:#f2b705;
  --red:#c62828; --ink:#23303d; --soft:#f4f7fb; --line:#d8e2ee;
}
*{box-sizing:border-box}
body{
  font-family:"Nunito","Segoe UI",Arial,sans-serif;margin:0;color:var(--ink);
  background:var(--soft);background-image:radial-gradient(#d7dee6 2px,transparent 2px);
  background-size:30px 30px;font-size:18px;line-height:1.6;
}
header{background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:16px 18px}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:15px;opacity:.92}
.wrap{max-width:980px;margin:auto;padding:18px 16px 80px}
.panel{background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.08);padding:18px;margin:16px 0}
h2{color:var(--dark);margin:0 0 10px}
.audio{background:#fff;border:2px solid var(--line);border-radius:18px;color:#203963;font-weight:700;cursor:pointer;padding:6px 12px;font-size:14px;display:inline-flex;gap:5px;align-items:center}
.audio:hover{background:#eef4fa}
.word-card{border:2px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden;background:#fff}
.word-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;background:#eef4fb;cursor:pointer}
.word-title{font-size:21px;font-weight:900;color:var(--dark)}
.word-body{padding:0 16px 16px;display:none}
.word-card.open .word-body{display:block}
.section{border-top:1px solid var(--line);padding:12px 0}
.section h3{margin:0 0 6px;font-size:17px;color:var(--dark);display:flex;align-items:center;gap:8px}
.line{display:flex;gap:8px;align-items:flex-start;margin:7px 0}
.line span{flex:1}
.example{background:#f2f8f2;border-left:5px solid var(--green);padding:9px 11px;border-radius:8px;margin:7px 0}
.nonexample{background:#fff1f0;border-left:5px solid var(--red);padding:9px 11px;border-radius:8px;margin:7px 0}
.related{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eaf2fb;border:2px solid #bcd6f2;color:#1f3864;border-radius:18px;padding:5px 12px;font-weight:700}
.frame{background:#fff8e1;border:2px dashed #e0b400;border-radius:12px;padding:12px;margin-top:8px}
.frame input{font:inherit;width:100%;padding:10px;margin-top:8px;border:2px solid var(--line);border-radius:8px}
.note{font-size:14px;color:#536375;font-style:italic;margin:6px 0 0}
textarea{font:inherit;width:100%;min-height:90px;padding:10px;border:2px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical}
footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to right,var(--dark),#23303d);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
footer button{background:#ffc400;border:0;color:#333;font:inherit;font-weight:800;border-radius:10px;padding:10px 16px;cursor:pointer}
@media(max-width:600px){
  header h1{font-size:20px}
  .wrap{padding:12px 8px 90px}
  .word-head{flex-wrap:wrap}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Country Word Explorer</h1>
  <p>Explore important words connected to Aboriginal Country. Tap 🔊 to listen to any part.</p>
</header>

<div class="wrap">
  <section class="panel">
    <h2>Choose a word</h2>
    <p>Tap a word to open its meaning, examples, related words and writing activity.</p>
    <button class="audio" id="readList">🔊 Read the word list</button>
  </section>

  <section id="wordList"></section>
</div>

<footer>
  <span>Country Word Explorer</span>
  <button id="topButton">Back to top</button>
</footer>

const list=document.getElementById("wordList");

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-AU";
  u.rate=.9;
  speechSynthesis.speak(u);
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function audio(text,label="Listen"){
  return `<button class="audio" data-say="${esc(text)}" aria-label="${esc(label)}">🔊</button>`;
}

function render(){
  list.innerHTML=words.map(w=>{
    const related=w.related.map(r=>`<span class="chip">${esc(r)}</span>`).join("");
    const examples=w.examples.map(e=>`
      <div class="example"><div class="line"><span>${esc(e)}</span>${audio(e,"Listen to example")}</div></div>`).join("");

    const nonExamples=w.nonExamples.map(n=>`
      <div class="nonexample">
        <div class="line"><span><strong>Not this meaning:</strong> ${esc(n.text)}</span>${audio(n.text)}</div>
        <div class="line"><span><strong>Why:</strong> ${esc(n.why)}</span>${audio(n.why)}</div>
      </div>`).join("");

    return `<article class="word-card" data-word="${esc(w.word)}">
      <div class="word-head" data-toggle="1">
        <div class="word-title">${esc(w.word)}</div>
        <div>${audio(`${w.word}. ${w.meaning}`,"Listen to this word")}<span style="font-size:22px">▾</span></div>
      </div>
      <div class="word-body">
        <div class="section">
          <h3>What does it mean? ${audio(w.meaning)}</h3>
          <div class="line"><span>${esc(w.meaning)}</span></div>
          <p class="note">Word type: ${esc(w.type)} ${audio(`Word type: ${w.type}`)}</p>
        </div>

        <div class="section">
          <h3>See it in a sentence ${audio("Here are some example sentences.")}</h3>
          ${examples}
        </div>

        <div class="section">
          <h3>Related words ${audio("These words are related to "+w.word+".")}</h3>
          <div class="related">${related}</div>
          <p class="note">Related words share an idea. They are not always exact synonyms.</p>
        </div>

        <div class="section">
          <h3>Opposite or contrast ${audio(w.opposite)}</h3>
          <div class="line"><span>${esc(w.opposite)}</span>${audio(w.opposite)}</div>
        </div>

        <div class="section">
          <h3>What does not fit? ${audio("These examples do not show the meaning of "+w.word+".")}</h3>
          ${nonExamples}
        </div>

        <div class="section">
          <h3>What feeling does it give? ${audio(w.connotation)}</h3>
          <div class="line"><span>${esc(w.connotation)}</span></div>
        </div>

        <div class="section">
          <h3>Where does it come from? ${audio(w.origin)}</h3>
          <div class="line"><span>${esc(w.origin)}</span></div>
        </div>

        <div class="section">
          <h3>Your turn ${audio("Complete this sentence.")}</h3>
          <div class="frame">
            <div class="line"><span>${esc(w.frame)}</span>${audio(w.frame)}</div>
            <input class="sentence-input" aria-label="Complete the sentence for ${esc(w.word)}">
          </div>
          <p class="note">Now use the word in your own sentence.</p>
          <textarea class="own-writing" placeholder="Write your own sentence using ${esc(w.word)}." aria-label="Write your own sentence using ${esc(w.word)}"></textarea>
          <button class="audio" data-read-word="${esc(w.word)}">🔊 Read my sentence</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

document.addEventListener("click",e=>{
  const sayButton=e.target.closest("[data-say]");
  if(sayButton){speak(sayButton.dataset.say);return;}

  const head=e.target.closest("[data-toggle]");
  if(head){
    head.closest(".word-card").classList.toggle("open");
    return;
  }

  const readWord=e.target.closest("[data-read-word]");
  if(readWord){
    const card=readWord.closest(".word-card");
    const word=card.dataset.word;
    const frame=card.querySelector(".sentence-input").value;
    const own=card.querySelector(".own-writing").value;
    speak(`For the word ${word}, the sentence frame says: ${frame||"no answer yet"}. Your own sentence says: ${own||"no sentence yet"}.`);
    return;
  }

  if(e.target.id==="readList"){
    speak(words.map(w=>w.word).join(", "));
    return;
  }

  if(e.target.id==="topButton"){
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

render();
</script>
